name: Build Analysis Reproducibility Package

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_zenodo_v4_package.yml"
      - "zenodo_v4/**"
      - "archive/zenodo_v3/golden/output/**"
      - "archive/zenodo_v3/golden/ltcm_holdout/**"
      - "data/ltcm_holdout/**"
      - "archive/zenodo_v3/code/run_historical_holdout.py"
      - "archive/zenodo_v3/scripts/verify_ltcm_holdout.py"
      - "archive/zenodo_v3/docs/channel_selection_protocol_v1.md"
      - "archive/zenodo_v3/docs/ltcm_protocol_addendum_v1_1.md"
      - "archive/zenodo_v3/docs/ltcm_protocol_addendum_v1_2.md"
      - "archive/zenodo_v3/docs/CORRECTION_2026-10-05.md"
      - "requirements-lock.txt"

jobs:
  build-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Syntax-check current analysis scripts
        run: |
          python -m py_compile \
            zenodo_v4/holdout2/build_candidate_universe.py \
            zenodo_v4/holdout2/build_eligibility_audit.py \
            zenodo_v4/holdout2/select_holdout2_event.py \
            zenodo_v4/holdout2/run_holdout2_analysis.py \
            zenodo_v4/simulation/run_simulation_v2.py \
            zenodo_v4/simulation/make_figure_simulation_primary.py \
            zenodo_v4/simulation/make_figure_simulation_combined.py \
            archive/zenodo_v3/code/run_historical_holdout.py \
            archive/zenodo_v3/scripts/verify_ltcm_holdout.py

      - name: Verify Holdout 2 pre-output freeze hashes
        run: |
          sha256sum -c zenodo_v4/holdout2/holdout2_preoutput_sha256.txt

      - name: Verify Holdout 2 frozen result hashes
        run: |
          sha256sum -c zenodo_v4/holdout2/holdout2_result_sha256.txt

      - name: Verify Simulation v2 frozen result hashes
        run: |
          sha256sum -c zenodo_v4/simulation/simulation_v2_result_sha256.txt

      - name: Validate frozen result structure and canonical manuscript values
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from pathlib import Path

          root = Path("zenodo_v4")

          holdout = pd.read_csv(
              root / "holdout2" / "results" / "holdout2_aligned_series.csv"
          )
          with (
              root / "holdout2" / "results" / "holdout2_summary.json"
          ).open(encoding="utf-8") as f:
              holdout_summary = json.load(f)

          assert len(holdout) == 500
          assert holdout["period"].value_counts().to_dict() == {
              "control": 250,
              "post": 250,
          }
          assert int(holdout.isna().sum().sum()) == 0
          assert holdout_summary["selected_event"]["event_id"] == "usp000c8mb"

          sim_dir = root / "simulation" / "results"
          alt = pd.read_csv(sim_dir / "simulation_v2_alt_replicates.csv")
          null = pd.read_csv(sim_dir / "simulation_v2_null_replicates.csv")
          summary = pd.read_csv(sim_dir / "simulation_v2_summary.csv")

          assert len(alt) == 216000
          assert len(null) == 24000
          assert len(summary) == 216
          assert int(alt.isna().sum().sum()) == 0
          assert int(null.isna().sum().sum()) == 0
          assert int(summary.isna().sum().sum()) == 0
          assert np.isfinite(alt["T"]).all()
          assert np.isfinite(null["T"]).all()
          assert np.isfinite(summary.select_dtypes(include="number").to_numpy()).all()

          assert not alt.duplicated(
              ["k", "rho", "delta", "replicate", "normalization", "operator"]
          ).any()
          assert not null.duplicated(
              ["rho", "replicate", "normalization", "operator"]
          ).any()
          assert not summary.duplicated(
              ["k", "rho", "delta", "normalization", "operator"]
          ).any()

          formulations = pd.read_csv(
              "archive/zenodo_v3/golden/output/table_nonoverlap_formulations.csv"
          )
          fuku = formulations[
              (formulations["Case"] == "Fukushima")
              & (formulations["Formulation"] == "Multiplicative")
          ]
          assert len(fuku) == 1
          assert np.isclose(
              float(fuku.iloc[0]["Post_control_to_control_mean_ratio"]),
              2.3159924201,
          )

          ltcm = pd.read_csv(
              "archive/zenodo_v3/golden/ltcm_holdout/table_ltcm_primary.csv"
          )
          ratio_cols = [c for c in ltcm.columns if "ratio" in c.lower()]
          assert ratio_cols, "LTCM primary table must contain a ratio column"
          assert np.isclose(float(ltcm.iloc[0][ratio_cols[0]]), 1.1469269769)

          print("Frozen result structure and canonical values: OK")
          PY

      - name: Check source assets
        run: |
          test -f archive/zenodo_v3/golden/output/figures/Figure1_Pi_timeseries.png
          test -f archive/zenodo_v3/golden/output/figures/Figure2_cross_domain_separation.png
          test -f archive/zenodo_v3/golden/output/figures/Figure3_mult_vs_add_vs_max.png

          test -f zenodo_v4/simulation/figures/Figure_simulation_combined_delta1.png
          test -f zenodo_v4/simulation/figures/Figure_simulation_combined_delta1.pdf

          test -f archive/zenodo_v3/golden/ltcm_holdout/manifest_ltcm.json
          test -f archive/zenodo_v3/golden/ltcm_holdout/table_ltcm_primary.csv
          test -f archive/zenodo_v3/golden/ltcm_holdout/table_ltcm_formulations.csv
          test -f archive/zenodo_v3/golden/ltcm_holdout/table_ltcm_ablation.csv
          test -f archive/zenodo_v3/golden/ltcm_holdout/table_ltcm_permutation.csv
          test -f archive/zenodo_v3/scripts/verify_ltcm_holdout.py
          test -f data/ltcm_holdout/ltcm_historical_holdout_processed.csv
          test -f data/ltcm_holdout/raw_DFF.csv
          test -f data/ltcm_holdout/raw_TEDRATE.csv
          test -f data/ltcm_holdout/raw_TOTBKCR.csv

          echo "Source assets: OK"

      - name: Remove Python cache files
        run: |
          find zenodo_v4 -type d -name "__pycache__" -prune -exec rm -rf {} +
          find zenodo_v4 -type f -name "*.pyc" -delete

      - name: Assemble blinded analysis package
        run: |
          PKG=_artifact/analysis_reproducibility_package
          FIG=_artifact/manuscript_figure_sources

          rm -rf "$PKG" "$FIG"
          mkdir -p "$PKG" "$FIG/legacy_v3" "$FIG/current"

          cp requirements-lock.txt "$PKG/"
          cp -R zenodo_v4 "$PKG/"

          mkdir -p "$PKG/legacy/development"
          cp -R archive/zenodo_v3/golden/output \
            "$PKG/legacy/development/"

          mkdir -p "$PKG/legacy/ltcm/data"
          mkdir -p "$PKG/legacy/ltcm/golden"
          mkdir -p "$PKG/legacy/ltcm/output"
          mkdir -p "$PKG/legacy/ltcm/code"
          mkdir -p "$PKG/legacy/ltcm/scripts"
          mkdir -p "$PKG/legacy/ltcm/protocols"

          cp -R data/ltcm_holdout \
            "$PKG/legacy/ltcm/data/"
          cp -R archive/zenodo_v3/golden/ltcm_holdout \
            "$PKG/legacy/ltcm/golden/"
          cp -R archive/zenodo_v3/golden/ltcm_holdout \
            "$PKG/legacy/ltcm/output/"
          cp archive/zenodo_v3/code/run_historical_holdout.py \
            "$PKG/legacy/ltcm/code/"
          cp archive/zenodo_v3/scripts/verify_ltcm_holdout.py \
            "$PKG/legacy/ltcm/scripts/"
          cp archive/zenodo_v3/docs/channel_selection_protocol_v1.md \
            "$PKG/legacy/ltcm/protocols/"
          cp archive/zenodo_v3/docs/ltcm_protocol_addendum_v1_1.md \
            "$PKG/legacy/ltcm/protocols/"
          cp archive/zenodo_v3/docs/ltcm_protocol_addendum_v1_2.md \
            "$PKG/legacy/ltcm/protocols/"
          cp archive/zenodo_v3/docs/CORRECTION_2026-10-05.md \
            "$PKG/legacy/ltcm/protocols/"

          cp archive/zenodo_v3/golden/output/figures/*.png "$FIG/legacy_v3/"
          cp archive/zenodo_v3/golden/output/figures/*.pdf "$FIG/legacy_v3/"
          cp zenodo_v4/simulation/figures/Figure_simulation_combined_delta1.png \
            "$FIG/current/"
          cp zenodo_v4/simulation/figures/Figure_simulation_combined_delta1.pdf \
            "$FIG/current/"

          cat > "$PKG/README.md" <<'EOF'
          # Analysis Reproducibility Package

          This is a blinded review copy of the analysis materials supporting the manuscript.

          ## Evidence map

          - `legacy/development/output/`: canonical retrospective development outputs.
          - `legacy/ltcm/`: frozen LTCM historical-transfer data, outputs, protocols, code, and verifier.
          - `zenodo_v4/holdout2/`: output-blind historical Holdout 2 selection and frozen results.
          - `zenodo_v4/simulation/`: frozen controlled Simulation v2 inputs and outputs.

          ## Verification

          From the package root:

          ```bash
          sha256sum -c zenodo_v4/holdout2/holdout2_preoutput_sha256.txt
          sha256sum -c zenodo_v4/holdout2/holdout2_result_sha256.txt
          sha256sum -c zenodo_v4/simulation/simulation_v2_result_sha256.txt
          python legacy/ltcm/scripts/verify_ltcm_holdout.py
          sha256sum -c SHA256SUMS.txt
          ```

          The Holdout 2 pre-output manifest in this review copy is regenerated after a provenance-only repository identifier is blinded. Scientific query parameters, candidate records, selected-event records, analysis code, and reported results are unchanged.

          `FILE_LIST.txt` contains package-relative paths. `SHA256SUMS.txt` covers every package file except itself.
          EOF

          cat > "$PKG/BLINDING_NOTE.md" <<'EOF'
          # Blinding note

          One repository-identifying provenance string in `zenodo_v4/config/holdout2_candidate_query.json` is replaced with `[blinded repository]` in this review copy. No analytical parameter, data value, random seed, candidate universe, selected event, code logic, frozen result, or manuscript value is changed by this redaction.

          Because that metadata file changes byte-for-byte, the review-copy Holdout 2 pre-output SHA-256 manifest is regenerated after redaction so that verification remains internally consistent. The original frozen repository record is preserved outside this blinded review artifact.
          EOF

          python - <<'PY'
          from pathlib import Path
          import hashlib

          pkg = Path("_artifact/analysis_reproducibility_package")
          query = pkg / "zenodo_v4/config/holdout2_candidate_query.json"
          text = query.read_text(encoding="utf-8")
          text = text.replace("Junwon03/pi-framework-junwon", "[blinded repository]")
          query.write_text(text, encoding="utf-8")

          manifest = pkg / "zenodo_v4/holdout2/holdout2_preoutput_sha256.txt"
          original = manifest.with_name("holdout2_preoutput_sha256_frozen_original.txt")
          original.write_text(manifest.read_text(encoding="utf-8"), encoding="utf-8")

          paths = []
          for line in original.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              _, rel = line.split(maxsplit=1)
              paths.append(rel.strip())

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          manifest.write_text(
              "".join(f"{sha256(pkg / rel)}  {rel}\n" for rel in paths),
              encoding="utf-8",
          )
          PY

          if grep -RIlE \
            'Junwon03|Junwon Lee|herrang0311|dankook|10\.5281/zenodo\.22765907' \
            "$PKG"; then
            echo "ERROR: identifying text remains in blinded package"
            exit 1
          fi

          (
            cd "$PKG"
            find . -type f \
              ! -name 'FILE_LIST.txt' \
              ! -name 'SHA256SUMS.txt' \
              -print | sed 's#^\./##' | sort > FILE_LIST.txt

            find . -type f \
              ! -name 'SHA256SUMS.txt' \
              -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Verify assembled package
        run: |
          PKG=_artifact/analysis_reproducibility_package

          (
            cd "$PKG"
            sha256sum -c zenodo_v4/holdout2/holdout2_preoutput_sha256.txt
            sha256sum -c zenodo_v4/holdout2/holdout2_result_sha256.txt
            sha256sum -c zenodo_v4/simulation/simulation_v2_result_sha256.txt
            python legacy/ltcm/scripts/verify_ltcm_holdout.py
            sha256sum -c SHA256SUMS.txt
          )

          python - <<'PY'
          from pathlib import Path
          root = Path("_artifact/analysis_reproducibility_package")
          listed = (root / "FILE_LIST.txt").read_text(encoding="utf-8").splitlines()
          assert listed, "FILE_LIST.txt is empty"
          assert all(not p.startswith("_artifact/") for p in listed)
          assert "README.md" in listed
          assert "BLINDING_NOTE.md" in listed
          assert "legacy/ltcm/scripts/verify_ltcm_holdout.py" in listed
          print("Package-relative file list and review metadata: OK")
          PY

      - name: Upload analysis reproducibility package
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reproducibility-package
          path: _artifact/analysis_reproducibility_package/
          if-no-files-found: error
          retention-days: 30

      - name: Upload manuscript figure sources
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-figure-sources
          path: _artifact/manuscript_figure_sources/
          if-no-files-found: error
          retention-days: 30
