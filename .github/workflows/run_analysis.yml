name: Pi Revision and Audit Reproducibility

on:
  push:
    branches:
      - main
      - 'revision/**'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    env:
      FRED_VINTAGE_DATE: "2026-02-17"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Ensure FRED secret exists
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "ERROR: FRED_API_KEY secret is missing."
            exit 1
          fi

      - name: Generate legacy original-window and audit artifacts
        run: python run_all.py --all

      - name: Run benchmark (channel ablation)
        run: python run_benchmark.py

      - name: Run v12 enhancements
        run: python run_v12_enhancements.py

      - name: Run v13 enhancements
        run: python run_v13_enhancements.py

      - name: Generate revised post-control primary package
        run: python run_nonoverlap_reanalysis.py

      - name: Generate legacy retrospective-label threshold-grid audit
        run: python run_threshold_grid.py

      - name: Generate active variable-substitution specification sensitivity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_variable_substitution.py

      - name: Generate exploratory additional-case source artifacts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_additional_cases.py

      - name: Generate active additional-case metric alignment
        run: python run_additional_metric_alignment.py

      - name: Generate active specification provenance
        run: python run_specification_provenance.py

      - name: Legacy ST15 alternate reconstruction audit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python sensitivity/sensitivity_delta_k.py

      - name: Generate legacy ST17 trajectory audit
        run: python run_method_comparison.py

      - name: Verify classified deterministic artifacts against golden baseline
        run: python scripts/verify_outputs.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pi-analysis-results
          path: |
            output/
            data/
