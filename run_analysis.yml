name: Pi Unified Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-24.04
    env:
      FRED_VINTAGE_DATE: "2026-02-17"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Ensure FRED secret exists
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "ERROR: FRED_API_KEY secret is missing."
            exit 1
          fi

      - name: Run all analyses + figures
        run: python run_all.py --all

      - name: Run benchmark (channel ablation)
        run: python run_benchmark.py

      - name: Run v12 enhancements
        run: python run_v12_enhancements.py

      - name: Run v13 enhancements
        run: python run_v13_enhancements.py

      - name: Run variable substitution
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_variable_substitution.py

      - name: Run additional validation cases
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_additional_cases.py

      - name: ST14 Transform window sensitivity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python sensitivity/sensitivity_delta_k.py

      - name: ST15 Matched-pipeline specificity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python sensitivity/sensitivity_matched_pipeline.py

      - name: ST16-17 Method comparison and pseudo-prospective
        run: python run_method_comparison.py

      - name: Verify outputs against golden baseline
        run: python scripts/verify_outputs.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pi-analysis-results
          path: |
            output/
            data/
